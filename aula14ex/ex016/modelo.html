<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vamos Contar</h1>
    </header>
    <section>
        <div id="formulario">
            Início: <input type="number" name="iniciotxt" id="iniciotxt">
            <br>

            Fim: <input type="number" name="txtfim" id="txtfim">
            <br>

            Passo: <input type="number" name="inctxt" id="inctxt">
            <br>

            <input type="submit" value="Contar" onclick="contar()">
            <br>

        </div>
        <div id="res">
            Preparando a contagem
        </div>
    </section>
    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
